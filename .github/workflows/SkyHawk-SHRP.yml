name: SkyHawk [SHRP]

on:
  workflow_dispatch:
    inputs:
      MANIFEST:
        description: 'SHRP Manifest'
        required: true
        default: 'https://github.com/SHRP-Reborn/manifest.git'
      MANIFEST_BRANCH:
        description: 'SHRP Manifest Branch'
        required: true
        default: 'shrp-12.1'
        type: choice
        options:
        - shrp-12.1
        - shrp-9.0
      BUILD_TARGET:
        description: 'Specify your Build Target' # Pick among boot, recovery and vendor_boot
        required: true
        default: 'recovery'
        type: choice
        options:
        - boot
        - recovery
        - vendorboot
      LDCHECK:
        description: 'Use LDCHECK'
        required: false
        default: 'false'
        type: boolean
      LDCHECKPATH:
        description: 'Path of blobs to check' # Use it know what kind of dependencies your missing for decryption blobs.
        required: true
        default: 'system/bin/qseecomd'

jobs:
  build:
    name: Build SHRP by ${{ github.actor }}
    runs-on: ubuntu-22.04
    if: github.event.repository.owner.id == github.event.sender.id
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Tu device tree y tu fork del recovery core, ya incrustados (antes eran inputs)
      DEVICE_TREE: https://github.com/christiandroid20/shrp_device_samsung_a35x.git
      DEVICE_TREE_BRANCH: shrp-12.1
      RECOVERY_CORE: https://github.com/christiandroid20/shrp_android_bootable_recovery.git
      RECOVERY_CORE_BRANCH: android-12.1
    permissions:
      contents: write
    steps:
    - name: Check Out
      uses: actions/checkout@v4
      
    - name: Display Inputs
      run: |
        echo "::notice::📋 Build Configuration"
        echo "Manifest Branch: ${{ inputs.MANIFEST_BRANCH }}"
        echo "Device Tree: ${{ env.DEVICE_TREE }} (${{ env.DEVICE_TREE_BRANCH }})"
        echo "Build Target: ${{ inputs.BUILD_TARGET }}image"

    - name: Cleanup
      uses: rokibhasansagar/slimhub_actions@main
      
    - name: Set Swap Space
      uses: pierotofy/set-swap-space@master
      with:
        swap-size-gb: 12

    - name: Check Manifest Branch
      run: |
        if [ ${{ inputs.MANIFEST_BRANCH }} == 'v3_11.0' ] || [ ${{ inputs.MANIFEST_BRANCH }} == 'shrp-12.1' ]; then
            echo "CHECK_LEGACY_BRANCH=false" >> $GITHUB_ENV
        else
            echo "CHECK_LEGACY_BRANCH=true" >> $GITHUB_ENV
        fi

    - name: 📦 Prepare the environment
      run: |
        echo "::notice::📦 Installing build dependencies..."
        sudo apt update
        sudo apt -y upgrade
        sudo apt -y install gperf gcc-multilib gcc-10-multilib g++-multilib g++-10-multilib libc6-dev lib32ncurses5-dev x11proto-core-dev libx11-dev tree lib32z-dev libgl1-mesa-dev libxml2-utils xsltproc bc liblz4-tool imagemagick gpg gnupg2 flex bison gawk expat texinfo python3-dev libgcc1 gcc pkg-config libssl-dev
        echo "::notice::✅ Dependencies installed"

    - name: ☕ Install OpenJDK
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '8'

    - name: 🐍 Install Python 2.7
      run: |
        echo "::notice::🐍 Installing Python 2.7..."
        sudo apt-get update
        sudo apt-get install -y python2.7 python2-dev
        sudo update-alternatives --install /usr/bin/python2 python2 /usr/bin/python2.7 1
        python2.7 --version
        echo "::notice::✅ Python 2.7 installed"
        
    - name: 📂 Install Git-Repo
      run: |
        echo "::notice::📂 Installing git-repo tool..."
        mkdir ~/bin
        curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
        chmod a+x ~/bin/repo
        sudo ln -sf ~/bin/repo /usr/bin/repo
        echo "::notice::✅ Git-repo installed"

    - name: 🔧 Initialize Repo
      run: |
        echo "::notice::🔧 Initializing repository..."
        mkdir android-recovery
        cd android-recovery
        git config --global user.name "lazycodebuilder"
        git config --global user.email "154446636+lazycodebuilder@users.noreply.github.com"
        repo init --depth=1 -u ${{ inputs.MANIFEST }} -b ${{ inputs.MANIFEST_BRANCH }}
        echo "::notice::✅ Repository initialized"

    - name: 🔄 Repo Sync
      run: |
        echo "::warning::🔄 Syncing repositories (this may take a while)..."
        cd android-recovery
        repo sync -j4 --force-sync --no-clone-bundle --current-branch
        echo "::notice::✅ Repository sync complete"

    - name: 🔄 Clone Recovery & Device Tree
      run: |
        echo "::notice::🔄 Cloning recovery and device tree..."
        cd android-recovery
        rm -rf bootable/recovery
        git clone --branch ${{ env.RECOVERY_CORE_BRANCH }} --depth 1 ${{ env.RECOVERY_CORE }} bootable/recovery
        git clone ${{ env.DEVICE_TREE }} -b ${{ env.DEVICE_TREE_BRANCH }} ./device_tree
        cd device_tree
        echo "COMMIT_ID=$(git rev-parse HEAD)" >> $GITHUB_ENV
        echo "::notice::✅ Recovery fork and device tree cloned"

    - name: 🔍 Extract Configuration
      run: |
        echo "::notice::🔍 Extracting device configuration..."
        cd android-recovery/device_tree
        
        DEVICE_MAKEFILE=""
        DEVICE_DIRECTORY=""
        DEVICE_NAME=""
        
        for file in *.mk; do
            makefile=$(sed -n 's/^[[:space:]]*PRODUCT_NAME[[:space:]]*:=\s*\(.*\)/\1/p' "$file")
            brand=$(sed -n 's/^[[:space:]]*PRODUCT_BRAND[[:space:]]*:=\s*\(.*\)/\1/p' "$file")
            codename=$(sed -n 's/^[[:space:]]*PRODUCT_DEVICE[[:space:]]*:=\s*\(.*\)/\1/p' "$file")
            if [[ -n "$makefile" && -n "$brand" && -n "$codename" ]]; then
                DEVICE_MAKEFILE="$makefile"
                DEVICE_DIRECTORY="device/$brand"
                DEVICE_NAME="$codename"
                echo "DEVICE_MAKEFILE=${DEVICE_MAKEFILE}" >> $GITHUB_ENV
                echo "DEVICE_NAME=${DEVICE_NAME}" >> $GITHUB_ENV
                echo "DEVICE_DIRECTORY=${DEVICE_DIRECTORY}" >> $GITHUB_ENV
                break
            fi
        done
        
        cd ../
        mkdir -p "$DEVICE_DIRECTORY"
        mv device_tree "$DEVICE_DIRECTORY"/"$DEVICE_NAME"
        echo "::notice::✅ Device configuration extracted: $DEVICE_NAME"

    - name: 🍽️ Setup Lunch
      run: |
        echo "::notice::🍽️ Setting up build environment..."
        cd android-recovery
        source build/envsetup.sh
        export ALLOW_MISSING_DEPENDENCIES=true
        echo "::notice::🍽️ Running lunch: ${{ env.DEVICE_MAKEFILE }}-eng..."
        lunch ${{ env.DEVICE_MAKEFILE }}-eng
        echo "::notice::✅ Lunch configured"

    - name: 🔨 Building ${{ inputs.BUILD_TARGET }}.img
      run: |
        echo "::warning::🔨 Building ${{ inputs.BUILD_TARGET }}.img (this will take ~45-60 minutes)..."
        cd android-recovery
        source build/envsetup.sh
        lunch ${{ env.DEVICE_MAKEFILE }}-eng
        START_TIME=$(date +%s)
        mka ${{ inputs.BUILD_TARGET }}image -j16
        BUILD_STATUS=$?
        END_TIME=$(date +%s)
        BUILD_TIME=$((END_TIME - START_TIME))
        
        if [ $BUILD_STATUS -eq 0 ]; then
          echo "::notice::✅ Build completed in $((BUILD_TIME / 60))m $((BUILD_TIME % 60))s"
        else
          echo "::error::❌ Build failed with exit code: $BUILD_STATUS"
          exit $BUILD_STATUS
        fi

    - name: 📋 Set Build Metadata
      run: |
        echo "::notice::📋 Configuring build metadata..."
        if [ ${{ inputs.BUILD_TARGET }} == 'recovery' ]; then
           echo "BUILD_TARGET_NAME=recovery" >> $GITHUB_ENV
        elif [ ${{ inputs.BUILD_TARGET }} == 'boot' ]; then
           echo "BUILD_TARGET_NAME=boot" >> $GITHUB_ENV
        else
           echo "BUILD_TARGET_NAME=vendor_boot" >> $GITHUB_ENV
        fi
        echo "BUILD_DATE=$(date +%Y%m%d)" >> $GITHUB_ENV
        echo "::notice::✅ Metadata configured"

    - name: 📤 Upload to Release
      uses: softprops/action-gh-release@master
      with:
        files: |
          android-recovery/out/target/product/${{ env.DEVICE_NAME }}/${{ env.BUILD_TARGET_NAME }}.img
          android-recovery/out/target/product/${{ env.DEVICE_NAME }}/SHRP*.zip
          android-recovery/out/target/product/${{ env.DEVICE_NAME }}/ramdisk-recovery.*
        name: Unofficial SHRP For ${{ env.DEVICE_NAME }} // ${{ env.BUILD_DATE }}
        tag_name: ${{ github.run_id }}
        body: |
          Build: ${{ inputs.MANIFEST_BRANCH }}
          Device: [Device Tree/Branch](${{ env.DEVICE_TREE }}/tree/${{ env.DEVICE_TREE_BRANCH }})
          Commit: Most recent [commit](${{ env.DEVICE_TREE }}/commit/${{ env.COMMIT_ID }}) during building.

    - name: 🧪 Run LDCheck
      if: inputs.LDCHECK == 'true'
      run: |
        echo "::notice::🧪 Running LDCheck analysis..."
        cd tools
        mv -n libneeds ${GITHUB_WORKSPACE}/android-recovery/out/target/product/${{ env.DEVICE_NAME }}/recovery/root/
        mv -n ldcheck ${GITHUB_WORKSPACE}/android-recovery/out/target/product/${{ env.DEVICE_NAME }}/recovery/root/
        cd ../android-recovery/out/target/product/${{ env.DEVICE_NAME }}/recovery/root
        python3 ldcheck -p system/lib64:vendor/lib64:system/lib:vendor/lib -d ${{ inputs.LDCHECKPATH }}
        echo "::notice::✅ LDCheck complete"
      continue-on-error: true
