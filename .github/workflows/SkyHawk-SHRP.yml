name: SkyHawk [SHRP]

on:
  workflow_dispatch:
    inputs:
      MANIFEST:
        description: 'SHRP Manifest'
        required: true
        default: 'https://github.com/SHRP-Reborn/manifest.git'
      MANIFEST_BRANCH:
        description: 'SHRP Manifest Branch'
        required: true
        default: 'shrp-12.1'
        type: choice
        options:
        - shrp-12.1
        - shrp-9.0
      BUILD_TARGET:
        description: 'Build Target(s) — separa varios con coma, ej: recovery,boot'
        required: true
        default: 'recovery'
      LDCHECK:
        description: 'Use LDCHECK'
        required: false
        default: 'false'
        type: boolean
      LDCHECKPATH:
        description: 'Path of blobs to check' # Use it know what kind of dependencies your missing for decryption blobs.
        required: true
        default: 'system/bin/qseecomd'

jobs:
  prepare-matrix:
    name: Prepare matrix (UI-friendly)
    runs-on: ubuntu-22.04
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Build matrix JSON from input BUILD_TARGET
        id: set-matrix
        shell: bash
        run: |
          set -euo pipefail
          raw="${{ inputs.BUILD_TARGET }}"
          if [ -z "$raw" ]; then
            raw="recovery"
          fi
          IFS=',' read -ra arr <<< "$raw"
          json='['
          first=true
          for v in "${arr[@]}"; do
            v="$(echo "$v" | xargs)"
            if [ -z "$v" ]; then
              continue
            fi
            if [ "$first" = true ]; then
              json="$json\"$v\""
              first=false
            else
              json="$json,\"$v\""
            fi
          done
          json="$json]"
          echo "matrix={\"target\":$json}" >> $GITHUB_OUTPUT

  build:
    name: 🛠️ Build ${{ matrix.target }} by ${{ github.actor }}
    needs: prepare-matrix
    runs-on: ubuntu-22.04
    if: github.event.repository.owner.id == github.event.sender.id
    strategy:
      matrix: ${{ fromJson(needs.prepare-matrix.outputs.matrix) }}
      fail-fast: false
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Tu device tree y tu fork del recovery core, ya incrustados
      DEVICE_TREE: https://github.com/christiandroid20/shrp_device_samsung_a35x.git
      DEVICE_TREE_BRANCH: shrp-12.1
      RECOVERY_CORE: https://github.com/christiandroid20/shrp_android_bootable_recovery.git
      RECOVERY_CORE_BRANCH: android-12.1
    permissions:
      contents: write
    steps:
    - name: Check Out
      uses: actions/checkout@v4

    - name: Display Inputs
      run: |
        echo "::notice::📋 Build Configuration"
        echo "Manifest Branch: ${{ inputs.MANIFEST_BRANCH }}"
        echo "Device Tree: ${{ env.DEVICE_TREE }} (${{ env.DEVICE_TREE_BRANCH }})"
        echo "Build Target: ${{ matrix.target }}image"

    - name: Cleanup
      uses: rokibhasansagar/slimhub_actions@main

    - name: Set Swap Space
      uses: pierotofy/set-swap-space@master
      with:
        swap-size-gb: 12

    - name: Check Manifest Branch
      run: |
        # SHRP 12.1 still requires Python 2.7 for parts of the legacy build
        # tooling. Keep this explicitly enabled for the branch we are building.
        if [ "${{ inputs.MANIFEST_BRANCH }}" = "shrp-12.1" ]; then
            echo "CHECK_LEGACY_BRANCH=true" >> "$GITHUB_ENV"
        else
            echo "CHECK_LEGACY_BRANCH=false" >> "$GITHUB_ENV"
        fi

    - name: 📦 Prepare the environment
      run: |
        echo "::notice::📦 Installing build dependencies..."
        sudo apt update
        sudo apt -y upgrade

        # libtinfo5 / libncurses5(-dev) / lib32ncurses5-dev ya no están en
        # los repos de Ubuntu 22.04 (jammy pasó a ncurses6). Se traen
        # temporalmente del archivo de 20.04 (focal).
        echo "deb http://archive.ubuntu.com/ubuntu focal main universe" | sudo tee /etc/apt/sources.list.d/focal.list
        sudo apt update
        sudo apt -y install libtinfo5 libncurses5 libncurses5-dev lib32ncurses5-dev
        sudo rm /etc/apt/sources.list.d/focal.list
        sudo apt update

        sudo apt -y install gperf gcc-multilib gcc-10-multilib g++-multilib g++-10-multilib \
          libc6-dev x11proto-core-dev libx11-dev tree lib32z-dev libgl1-mesa-dev \
          libxml2-utils xsltproc bc ccache lib32readline-dev lib32z1-dev liblz4-tool \
          libsdl1.2-dev libwxgtk3.0-gtk3-dev libxml2 lzop pngcrush schedtool \
          squashfs-tools imagemagick libbz2-dev lzma ncftp qemu-user-static \
          libstdc++-10-dev libgflags-dev zip unzip flex bison gawk expat texinfo \
          gpg gnupg2 python3-dev pkg-config libssl-dev gcc
        echo "::notice::✅ Dependencies installed"

    - name: ☕ Install OpenJDK
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '8'

    - name: 🐍 Install Python 2.7 for SHRP 12.1
      if: inputs.MANIFEST_BRANCH == 'shrp-12.1'
      shell: bash
      run: |
        set -euo pipefail
        echo "::notice::🐍 Installing Python 2.7 for SHRP 12.1..."

        # Ubuntu 22.04 (jammy) no longer ships Python 2.7. SHRP 12.1
        # still invokes /usr/bin/env python2.7, so install the 2.7 packages
        # from Ubuntu 20.04 (focal), then remove the temporary repository.
        FOCAL_LIST="/etc/apt/sources.list.d/shrp-focal-python2.list"
        echo "deb http://archive.ubuntu.com/ubuntu focal main universe" | sudo tee "$FOCAL_LIST"

        sudo apt-get update
        sudo apt-get install -y --no-install-recommends python2.7 python2.7-minimal python2.7-dev

        sudo rm -f "$FOCAL_LIST"
        sudo apt-get update

        # Make both names available to old Android/SHRP build scripts.
        sudo update-alternatives --install /usr/bin/python2 python2 /usr/bin/python2.7 1

        if [ ! -x /usr/bin/python2.7 ]; then
          echo "::error::❌ /usr/bin/python2.7 was not installed"
          exit 1
        fi

        if ! command -v python2.7 >/dev/null 2>&1; then
          echo "::error::❌ python2.7 is not in PATH"
          exit 1
        fi

        python2.7 --version
        python2 --version

        echo "::notice::✅ Python 2.7 installed and verified"

    - name: 🧪 Verify SHRP 12.1 Python environment
      if: inputs.MANIFEST_BRANCH == 'shrp-12.1'
      shell: bash
      run: |
        set -euo pipefail
        echo "::notice::🧪 Verifying Python 2.7 before SHRP sync/build..."
        command -v python2.7
        /usr/bin/python2.7 --version
        command -v python2
        python2 --version
        test -x /usr/bin/python2.7
        echo "::notice::✅ SHRP 12.1 Python environment is ready"

    - name: 📂 Install Git-Repo
      run: |
        echo "::notice::📂 Installing git-repo tool..."
        mkdir ~/bin
        curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
        chmod a+x ~/bin/repo
        sudo ln -sf ~/bin/repo /usr/bin/repo
        echo "::notice::✅ Git-repo installed"

    - name: 🔧 Initialize Repo
      run: |
        echo "::notice::🔧 Initializing repository..."
        mkdir android-recovery
        cd android-recovery
        git config --global user.name "lazycodebuilder"
        git config --global user.email "154446636+lazycodebuilder@users.noreply.github.com"
        repo init --depth=1 -u ${{ inputs.MANIFEST }} -b ${{ inputs.MANIFEST_BRANCH }}
        echo "::notice::✅ Repository initialized"

    - name: 🔄 Repo Sync
      run: |
        echo "::warning::🔄 Syncing repositories (this may take a while)..."
        cd android-recovery
        repo sync -j4 --force-sync --no-clone-bundle --current-branch
        echo "::notice::✅ Repository sync complete"

    - name: 🔄 Clone Recovery & Device Tree
      run: |
        echo "::notice::🔄 Cloning recovery and device tree..."
        cd android-recovery
        rm -rf bootable/recovery
        git clone --branch ${{ env.RECOVERY_CORE_BRANCH }} --depth 1 ${{ env.RECOVERY_CORE }} bootable/recovery
        git clone ${{ env.DEVICE_TREE }} -b ${{ env.DEVICE_TREE_BRANCH }} ./device_tree
        cd device_tree
        echo "COMMIT_ID=$(git rev-parse HEAD)" >> $GITHUB_ENV
        echo "::notice::✅ Recovery fork and device tree cloned"

    - name: 🔍 Extract Configuration
      run: |
        echo "::notice::🔍 Extracting device configuration..."
        cd android-recovery/device_tree

        DEVICE_MAKEFILE=""
        DEVICE_DIRECTORY=""
        DEVICE_NAME=""

        for file in *.mk; do
            makefile=$(sed -n 's/^[[:space:]]*PRODUCT_NAME[[:space:]]*:=\s*\(.*\)/\1/p' "$file")
            brand=$(sed -n 's/^[[:space:]]*PRODUCT_BRAND[[:space:]]*:=\s*\(.*\)/\1/p' "$file")
            codename=$(sed -n 's/^[[:space:]]*PRODUCT_DEVICE[[:space:]]*:=\s*\(.*\)/\1/p' "$file")
            if [[ -n "$makefile" && -n "$brand" && -n "$codename" ]]; then
                DEVICE_MAKEFILE="$makefile"
                DEVICE_DIRECTORY="device/$brand"
                DEVICE_NAME="$codename"
                echo "DEVICE_MAKEFILE=${DEVICE_MAKEFILE}" >> $GITHUB_ENV
                echo "DEVICE_NAME=${DEVICE_NAME}" >> $GITHUB_ENV
                echo "DEVICE_DIRECTORY=${DEVICE_DIRECTORY}" >> $GITHUB_ENV
                break
            fi
        done

        cd ../
        mkdir -p "$DEVICE_DIRECTORY"
        mv device_tree "$DEVICE_DIRECTORY"/"$DEVICE_NAME"
        echo "::notice::✅ Device configuration extracted: $DEVICE_NAME"

    - name: 🍽️ Setup Lunch
      run: |
        echo "::notice::🍽️ Setting up build environment..."
        cd android-recovery
        source build/envsetup.sh
        export ALLOW_MISSING_DEPENDENCIES=true
        echo "::notice::🍽️ Running lunch: ${{ env.DEVICE_MAKEFILE }}-eng..."
        lunch ${{ env.DEVICE_MAKEFILE }}-eng
        echo "::notice::✅ Lunch configured"

    - name: 🔨 Building ${{ matrix.target }}.img
      run: |
        echo "::warning::🔨 Building ${{ matrix.target }}.img (this will take ~45-60 minutes)..."
        cd android-recovery
        source build/envsetup.sh
        lunch ${{ env.DEVICE_MAKEFILE }}-eng
        START_TIME=$(date +%s)
        mka ${{ matrix.target }}image -j$(nproc --all)
        BUILD_STATUS=$?
        END_TIME=$(date +%s)
        BUILD_TIME=$((END_TIME - START_TIME))

        if [ $BUILD_STATUS -eq 0 ]; then
          echo "::notice::✅ Build completed in $((BUILD_TIME / 60))m $((BUILD_TIME % 60))s"
        else
          echo "::error::❌ Build failed with exit code: $BUILD_STATUS"
          exit $BUILD_STATUS
        fi

    - name: 📋 Set Build Metadata
      run: |
        echo "::notice::📋 Configuring build metadata..."
        if [ ${{ matrix.target }} == 'recovery' ]; then
           echo "BUILD_TARGET_NAME=recovery" >> $GITHUB_ENV
        elif [ ${{ matrix.target }} == 'boot' ]; then
           echo "BUILD_TARGET_NAME=boot" >> $GITHUB_ENV
        else
           echo "BUILD_TARGET_NAME=vendor_boot" >> $GITHUB_ENV
        fi
        echo "BUILD_DATE=$(date +%Y%m%d)" >> $GITHUB_ENV
        echo "::notice::✅ Metadata configured"

    - name: 📤 Upload to Release
      uses: softprops/action-gh-release@master
      with:
        files: |
          android-recovery/out/target/product/${{ env.DEVICE_NAME }}/${{ env.BUILD_TARGET_NAME }}.img
          android-recovery/out/target/product/${{ env.DEVICE_NAME }}/SHRP*.zip
          android-recovery/out/target/product/${{ env.DEVICE_NAME }}/ramdisk-recovery.*
        name: Unofficial SHRP For ${{ env.DEVICE_NAME }} — ${{ matrix.target }} // ${{ env.BUILD_DATE }}
        tag_name: ${{ github.run_id }}-${{ matrix.target }}
        body: |
          Build: ${{ inputs.MANIFEST_BRANCH }}
          Target: ${{ matrix.target }}
          Device: [Device Tree/Branch](${{ env.DEVICE_TREE }}/tree/${{ env.DEVICE_TREE_BRANCH }})
          Commit: Most recent [commit](${{ env.DEVICE_TREE }}/commit/${{ env.COMMIT_ID }}) during building.

    - name: 🧪 Run LDCheck
      if: inputs.LDCHECK == 'true'
      run: |
        echo "::notice::🧪 Running LDCheck analysis..."
        cd tools
        mv -n libneeds ${GITHUB_WORKSPACE}/android-recovery/out/target/product/${{ env.DEVICE_NAME }}/recovery/root/
        mv -n ldcheck ${GITHUB_WORKSPACE}/android-recovery/out/target/product/${{ env.DEVICE_NAME }}/recovery/root/
        cd ../android-recovery/out/target/product/${{ env.DEVICE_NAME }}/recovery/root
        python3 ldcheck -p system/lib64:vendor/lib64:system/lib:vendor/lib -d ${{ inputs.LDCHECKPATH }}
        echo "::notice::✅ LDCheck complete"
      continue-on-error: true
