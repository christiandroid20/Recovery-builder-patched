
name: AERA Recovery [A35x]

on:
  workflow_dispatch:
    inputs:
      MANIFEST_BRANCH:
        description: AERA Android manifest branch
        required: true
        default: aera-16.0
        type: choice
        options:
          - aera-16.0

      DEVICE_TREE:
        description: Device tree repository
        required: true
        default: https://github.com/christiandroid20/shrp_device_samsung_a35x

      DEVICE_TREE_BRANCH:
        description: Device tree branch
        required: true
        default: aera-crypto-fixes

      BUILD_TARGET:
        description: Recovery image target
        required: true
        default: recoveryimage
        type: choice
        options:
          - recoveryimage

      RELEASE:
        description: Publish a TEST GitHub Release after a successful build
        required: true
        default: true
        type: boolean

      RELEASE_LABEL:
        description: Short test label shown in the release title
        required: true
        default: TEST - build only
        type: string

      DATA_STATUS:
        description: Data decryption validation status (update only after device testing)
        required: true
        default: Not tested
        type: choice
        options:
          - Not tested
          - Tested - working
          - Tested - failing

      CHANGELOG:
        description: Changes included in this recovery image
        required: false
        default: Initial AERA A35x test build
        type: string

      EXTRA_FEATURES:
        description: Extra functions verified on the device (do not claim untested features)
        required: false
        default: None verified yet
        type: string

permissions:
  contents: write

concurrency:
  group: aera-a35x-build
  cancel-in-progress: false

jobs:
  build:
    name: Build AERA A35x
    runs-on: ubuntu-22.04
    timeout-minutes: 720

    env:
      MANIFEST_BRANCH: ${{ inputs.MANIFEST_BRANCH }}
      DEVICE_TREE: ${{ inputs.DEVICE_TREE }}
      DEVICE_TREE_BRANCH: ${{ inputs.DEVICE_TREE_BRANCH }}
      BUILD_TARGET: ${{ inputs.BUILD_TARGET }}
      WORK_DIR: ${{ github.workspace }}/AERA

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free runner space
        uses: rokibhasansagar/slimhub_actions@main

      - name: Configure swap
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 16

      - name: Install build dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git git-lfs curl wget aria2 \
            python3 python-is-python3 \
            openjdk-21-jdk \
            bc bison build-essential \
            flex g++-multilib gcc-multilib \
            libncurses-dev libssl-dev \
            libxml2-utils xsltproc \
            zlib1g-dev liblz4-tool lz4 \
            zip unzip rsync ccache \
            lib32z1-dev lib32ncurses-dev \
            libelf-dev libxml2-dev \
            pngcrush schedtool \
            squashfs-tools

      - name: Install Repo
        run: |
          mkdir -p "$HOME/bin"

          curl -fsSL \
            https://storage.googleapis.com/git-repo-downloads/repo \
            -o "$HOME/bin/repo"

          chmod +x "$HOME/bin/repo"

          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Initialize AERA manifest
        run: |
          mkdir -p "$WORK_DIR"
          cd "$WORK_DIR"

          git config --global user.name "AERA Builder"
          git config --global user.email \
            "github-actions[bot]@users.noreply.github.com"

          repo init \
            -u https://github.com/AERA-Recovery/android_manifest.git \
            -b "$MANIFEST_BRANCH"

      - name: Sync AERA sources
        run: |
          cd "$WORK_DIR"

          repo sync \
            -c \
            --force-sync \
            --no-clone-bundle \
            --no-tags \
            -j4

      - name: Clone A35x device tree
        run: |
          cd "$WORK_DIR"

          git clone \
            --depth=1 \
            -b "$DEVICE_TREE_BRANCH" \
            "$DEVICE_TREE" \
            device_tree

          cd device_tree

          echo "DEVICE_COMMIT=$(git rev-parse HEAD)" \
            >> "$GITHUB_ENV"

      - name: Configure A35x AERA product
        shell: bash
        run: |
          cd "$WORK_DIR"

          TREE=device/samsung/a35x

          mkdir -p device/samsung

          mv device_tree "$TREE"

          cd "$TREE"

          test -f AndroidProducts.mk
          test -f BoardConfig.mk
          test -f omni_a35x.mk

          # Preserve the original SHRP product.
          cp omni_a35x.mk twrp_a35x.mk

          # Register the AERA/TWRP Android 16 product.
          sed -i \
            's/omni_a35x.mk/twrp_a35x.mk/g' \
            AndroidProducts.mk

          sed -i \
            's/omni_a35x-eng/twrp_a35x-bp2a-eng/g' \
            AndroidProducts.mk

          sed -i \
            's/PRODUCT_NAME := omni_a35x/PRODUCT_NAME := twrp_a35x/' \
            twrp_a35x.mk

          # Verify prebuilt kernel components.
          test -f prebuilt/Image
          test -f prebuilt/dtb.img
          test -f prebuilt/dtbo.img

          echo "A35x product configured"
          echo "Kernel information:"
          strings prebuilt/Image | grep -m1 "Linux version" || true

          echo "Device tree commit: $DEVICE_COMMIT"

      - name: Build AERA Recovery
        shell: bash
        run: |
          cd "$WORK_DIR"

          export ALLOW_MISSING_DEPENDENCIES=true
          export USE_CCACHE=1
          export CCACHE_EXEC=/usr/bin/ccache

          ccache -M 5G

          # Android 16 AERA uses JDK 21. Bound Go/Soong memory and Ninja
          # concurrency for the hosted runner instead of relying on -j4.
          export GOMAXPROCS=2
          export GOGC=50
          export GOMEMLIMIT=4GiB

          echo "Java version:"
          java -version
          java -version 2>&1 | grep -q 'version "21' || {
            echo "Expected JDK 21 for Android 16 AERA build"
            exit 1
          }

          source build/envsetup.sh
          lunch twrp_a35x-bp2a-eng

          dump_memory_state() {
            echo "=== MEMORY DIAGNOSTICS $(date -u +%Y-%m-%dT%H:%M:%SZ) ==="
            free -h || true
            swapon --show || true
            grep -E 'MemTotal|MemAvailable|SwapTotal|SwapFree' /proc/meminfo || true
            [ ! -r /proc/pressure/memory ] || cat /proc/pressure/memory
            for f in /sys/fs/cgroup/memory.events /sys/fs/cgroup/memory.current /sys/fs/cgroup/memory.max; do
              if [ -r "$f" ]; then echo "--- $f"; cat "$f"; fi
            done
          }

          dump_memory_state

          monitor_resources() {
            while kill -0 "$BUILD_PID" 2>/dev/null; do
              echo "=== RESOURCE SAMPLE $(date -u +%Y-%m-%dT%H:%M:%SZ) ==="
              free -h
              grep -E 'MemAvailable|SwapFree' /proc/meminfo || true
              [ ! -r /proc/pressure/memory ] || cat /proc/pressure/memory
              [ ! -r /sys/fs/cgroup/memory.events ] || cat /sys/fs/cgroup/memory.events
              sleep 15
            done
          }

          on_build_signal() {
            echo "Build shell received $1"
            dump_memory_state
            exit 143
          }
          trap 'on_build_signal SIGTERM' TERM
          trap 'on_build_signal SIGINT' INT

          mka -j2 adbd "$BUILD_TARGET" &
          BUILD_PID=$!
          monitor_resources &
          MONITOR_PID=$!

          set +e
          wait "$BUILD_PID"
          BUILD_STATUS=$?
          kill "$MONITOR_PID" 2>/dev/null || true
          wait "$MONITOR_PID" 2>/dev/null || true
          set -e

          dump_memory_state
          echo "Build exit status: $BUILD_STATUS"
          exit "$BUILD_STATUS"

      - name: Collect recovery output
        if: success()
        shell: bash
        run: |
          cd "$WORK_DIR"

          OUT="out/target/product/a35x"

          test -d "$OUT"

          mkdir -p "$GITHUB_WORKSPACE/dist"

          find "$OUT" -maxdepth 2 -type f \
            \( -name "recovery.img" \
            -o -name "recovery.tar" \
            -o -name "ramdisk-recovery.*" \) \
            -exec cp -v {} "$GITHUB_WORKSPACE/dist/" \;

          if ! find "$GITHUB_WORKSPACE/dist" \
            -name "*.img" -print -quit | grep -q .; then
            echo "Recovery image not found"
            exit 1
          fi

          cd "$GITHUB_WORKSPACE/dist"

          sha256sum * > SHA256SUMS.txt

          echo "Build artifacts:"
          ls -lh

      - name: Upload GitHub Actions artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AERA-Recovery-A35x
          path: dist/
          if-no-files-found: error
          retention-days: 30

      - name: Set build information
        if: success()
        run: |
          echo "BUILD_DATE=$(date -u +%Y%m%d-%H%M)" \
            >> "$GITHUB_ENV"

      - name: Publish GitHub Release
        if: success() && inputs.RELEASE == true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: AERA-A35x-${{ github.run_number }}
          name: '[TEST] AERA A35x - ${{ inputs.RELEASE_LABEL }} - #${{ github.run_number }}'
          prerelease: true
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true
          body: |
            # TEST BUILD — AERA Recovery - Samsung Galaxy A35x

            **Validation:** TEST / prerelease. Not an official stable release.
            **Data decryption:** ${{ inputs.DATA_STATUS }}
            **Changes in this image:** ${{ inputs.CHANGELOG }}
            **Additional verified features:** ${{ inputs.EXTRA_FEATURES }}

            - Android manifest: ${{ inputs.MANIFEST_BRANCH }}
            - Device: Samsung Galaxy A35 5G
            - Codename: a35x
            - Device tree: ${{ inputs.DEVICE_TREE }}
            - Device branch: ${{ inputs.DEVICE_TREE_BRANCH }}
            - Device commit: ${{ env.DEVICE_COMMIT }}
            - Build date: ${{ env.BUILD_DATE }}
            - GitHub run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            Kernel: device tree prebuilt/Image
            Build target: recoveryimage

            SHA256 checksums included.
