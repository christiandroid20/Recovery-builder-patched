name: AERA Recovery [A35x]

on:
  push:
    branches:
      - aera-a35x-first-build
  workflow_dispatch:
    inputs:
      MANIFEST_BRANCH:
        description: AERA Android 16 manifest branch
        required: true
        default: aera-16.0
        type: choice
        options:
          - aera-16.0
      DEVICE_TREE:
        description: AERA A35X device tree repository
        required: true
        default: https://github.com/christiandroid20/aera_device_samsung_a35x.git
        type: string
      DEVICE_TREE_BRANCH:
        description: AERA A35X device tree branch
        required: true
        default: aera-16.0-work
        type: string
      BUILD_TARGET:
        description: Android recovery build target
        required: true
        default: recoveryimage
        type: choice
        options:
          - recoveryimage
      RUNNER:
        description: Where to execute the build
        required: true
        default: github-hosted
        type: choice
        options:
          - github-hosted
          - self-hosted
      RELEASE:
        description: Publish a prerelease after a verified build
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: aera-a35x-first-build
  # Never terminate an active Android build when another run is queued.
  cancel-in-progress: false

jobs:
  build:
    name: Build AERA A35X — ${{ github.actor }}
    # The self-hosted option requires a Linux x64 runner labeled
    # self-hosted, linux, x64, and aera-a35x. Push events stay hosted.
    runs-on: ${{ inputs.RUNNER == 'self-hosted' && fromJSON('["self-hosted","linux","x64","aera-a35x"]') || 'ubuntu-22.04' }}
    timeout-minutes: 720
    env:
      MANIFEST_BRANCH: ${{ inputs.MANIFEST_BRANCH || 'aera-16.0' }}
      DEVICE_TREE: ${{ inputs.DEVICE_TREE || 'https://github.com/christiandroid20/aera_device_samsung_a35x.git' }}
      DEVICE_TREE_BRANCH: ${{ inputs.DEVICE_TREE_BRANCH || 'aera-16.0-work' }}
      BUILD_TARGET: ${{ inputs.BUILD_TARGET || 'recoveryimage' }}
      WORK_DIR: ${{ github.workspace }}/AERA
      RECOVERY_PARTITION_SIZE: "100663296"

    steps:
      - name: Checkout builder
        uses: actions/checkout@v4

      - name: Free runner space
        if: inputs.RUNNER != 'self-hosted'
        uses: rokibhasansagar/slimhub_actions@main

      - name: Configure swap
        if: inputs.RUNNER != 'self-hosted'
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 16

      - name: Install build dependencies
        if: inputs.RUNNER != 'self-hosted'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            git git-lfs curl wget aria2 \
            python3 python-is-python3 \
            bc bison build-essential \
            flex g++-multilib gcc-multilib \
            libncurses-dev libssl-dev \
            libxml2-utils xsltproc \
            zlib1g-dev liblz4-tool lz4 \
            zip unzip rsync ccache \
            lib32z1-dev lib32ncurses-dev \
            libelf-dev libxml2-dev \
            pngcrush schedtool squashfs-tools \
            binutils file

          git lfs version
          git lfs install

      - name: Install JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "21"

      - name: Install Repo
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/bin"
          curl -fsSL \
            https://storage.googleapis.com/git-repo-downloads/repo \
            -o "$HOME/bin/repo"
          chmod +x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"
          "$HOME/bin/repo" --version

      - name: Initialize AERA Android 16 manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$WORK_DIR"
          cd "$WORK_DIR"

          git config --global user.name "AERA Builder"
          git config --global user.email \
            "github-actions[bot]@users.noreply.github.com"

          repo init \
            --depth=1 \
            -u https://github.com/AERA-Recovery/android_manifest.git \
            -b "$MANIFEST_BRANCH"

          test -f .repo/manifest.xml
          grep -R -q 'android_bootable_recovery' .repo/manifests

      - name: Sync AERA sources
        shell: bash
        run: |
          set -euo pipefail
          cd "$WORK_DIR"

          repo sync \
            -c \
            --force-sync \
            --no-clone-bundle \
            -j4

          test -f build/envsetup.sh
          test -f bootable/recovery/Android.mk
          test -f vendor/recovery/aera_soong_config.mk

      - name: Clone and validate the A35X AERA device tree
        shell: bash
        run: |
          set -euo pipefail
          cd "$WORK_DIR"

          DEVICE_PATH="device/samsung/a35x"
          mkdir -p device/samsung

          git clone \
            --depth=1 \
            --branch "$DEVICE_TREE_BRANCH" \
            "$DEVICE_TREE" \
            "$DEVICE_PATH"

          cd "$DEVICE_PATH"
          git lfs pull

          DEVICE_COMMIT="$(git rev-parse HEAD)"
          echo "DEVICE_COMMIT=$DEVICE_COMMIT" >> "$GITHUB_ENV"

          # This is already an AERA product tree. Do not copy/rename omni_*.mk
          # or rewrite AndroidProducts.mk: that broke the previous workflow.
          test -f AndroidProducts.mk
          test -f BoardConfig.mk
          test -f twrp_a35x.mk
          test -f device.mk
          test -f aera_a35x.mk
          test -f vendorsetup.sh
          test -f recovery.fstab

          grep -Eq 'twrp_a35x\.mk' AndroidProducts.mk
          grep -Eq 'twrp_a35x-bp2a-eng' AndroidProducts.mk
          grep -Eq 'PRODUCT_NAME[[:space:]]*:?=[[:space:]]*twrp_a35x' twrp_a35x.mk
          grep -Eq 'PRODUCT_DEVICE[[:space:]]*:?=[[:space:]]*a35x' twrp_a35x.mk
          grep -q 'aera_a35x.mk' device.mk

          # Required A35X prebuilt kernel components must be real files,
          # not Git LFS pointer stubs.
          for image in prebuilt/Image prebuilt/dtb.img prebuilt/dtbo.img; do
            test -s "$image"
            if head -c 128 "$image" | grep -aq 'git-lfs.github.com/spec/v1'; then
              echo "::error::Unresolved Git LFS pointer: $image"
              exit 1
            fi
          done

          echo "AERA device tree commit: $DEVICE_COMMIT"
          echo "AERA product files validated:"
          sed -n '1,100p' AndroidProducts.mk
          echo "Kernel:"
          file prebuilt/Image
          strings prebuilt/Image | grep -m1 'Linux version' || true
          echo "DTB / DTBO sizes:"
          stat -c '%n %s bytes' prebuilt/dtb.img prebuilt/dtbo.img

      - name: Build AERA recovery image
        shell: bash
        run: |
          # Android envsetup/lunch/get_build_var are not nounset-safe (TOP is
          # initially unset). Keep errexit and pipefail, but do not enable -u
          # in this Android build shell.
          set -eo pipefail
          cd "$WORK_DIR"

          export AERA_BUILD_DEVICE=a35x
          export ALLOW_MISSING_DEPENDENCIES=true
          export USE_CCACHE=1
          export CCACHE_EXEC=/usr/bin/ccache
          # Keep Soong's Go concurrency aligned with the conservative
          # three-job Ninja build. Retain the 4 GiB Go memory guardrail
          # because the previous run showed significant runner memory pressure.
          export GOMAXPROCS=3
          export GOGC=50
          export GOMEMLIMIT=4GiB

          ccache -M 5G

          echo "Java:"
          java -version
          java -version 2>&1 | grep -q 'version "21' || {
            echo "::error::AERA Android 16 requires JDK 21."
            exit 1
          }

          source build/envsetup.sh

          # The AERA A35X tree registers this lunch target itself.
          lunch twrp_a35x-bp2a-eng

          TARGET_PRODUCT_VALUE="$(get_build_var TARGET_PRODUCT)"
          PRODUCT_OUT_VALUE="$(get_build_var PRODUCT_OUT)"
          echo "TARGET_PRODUCT=$TARGET_PRODUCT_VALUE"
          echo "PRODUCT_OUT=$PRODUCT_OUT_VALUE"

          test "$TARGET_PRODUCT_VALUE" = "twrp_a35x"
          case "$PRODUCT_OUT_VALUE" in
            "$WORK_DIR/out/target/product/a35x"|"out/target/product/a35x") ;;
            *)
              echo "::error::Unexpected PRODUCT_OUT: $PRODUCT_OUT_VALUE"
              exit 1
              ;;
          esac

          echo "=== Runner memory before build ==="
          free -h
          swapon --show
          grep -E 'MemTotal|MemAvailable|SwapTotal|SwapFree' /proc/meminfo || true

          dump_memory_state() {
            echo "=== MEMORY DIAGNOSTICS $(date -u +%Y-%m-%dT%H:%M:%SZ) ==="
            free -h || true
            swapon --show || true
            grep -E 'MemTotal|MemAvailable|SwapTotal|SwapFree' /proc/meminfo || true
            [ ! -r /proc/pressure/memory ] || cat /proc/pressure/memory
            for f in /sys/fs/cgroup/memory.events /sys/fs/cgroup/memory.current /sys/fs/cgroup/memory.max; do
              if [ -r "$f" ]; then
                echo "--- $f"
                cat "$f"
              fi
            done
          }

          dump_memory_state

          # Keep the classic foreground mka/Ninja output. Capture the
          # return code without errexit terminating the shell before the
          # post-build diagnostics can run.
          on_build_signal() {
            signal_status="$1"
            trap - INT TERM
            echo "::warning::Build shell received a termination signal (status $signal_status)."
            dump_memory_state || true
            echo "=== Disk state at termination ==="
            df -h "$WORK_DIR" || true
            exit "$signal_status"
          }
          trap 'on_build_signal 130' INT
          trap 'on_build_signal 143' TERM

          echo "=== Starting AERA Android 16 recovery build ==="
          set +e
          mka -j3 adbd "$BUILD_TARGET"
          BUILD_STATUS=$?
          set -e

          echo "=== AERA build process returned ==="
          dump_memory_state
          echo "=== Disk state after build ==="
          df -h "$WORK_DIR" || true
          echo "Build exit status: $BUILD_STATUS"

          if [ "$BUILD_STATUS" -ne 0 ]; then
            echo "::error::mka failed with exit status $BUILD_STATUS"
            echo "=== Recent kernel messages (if permitted) ==="
            dmesg --ctime 2>/dev/null | tail -n 80 || true
          fi
          exit "$BUILD_STATUS"

      - name: Validate and collect recovery image
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          cd "$WORK_DIR"

          IMAGE="out/target/product/a35x/recovery.img"
          if [ ! -s "$IMAGE" ]; then
            echo "::error::Expected recovery image is missing: $IMAGE"
            find out/target/product/a35x -maxdepth 2 -type f -printf '%p %s bytes\n' | sort || true
            exit 1
          fi

          IMAGE_SIZE="$(stat -c '%s' "$IMAGE")"
          echo "Recovery image size: $IMAGE_SIZE bytes"
          echo "Recovery partition limit: $RECOVERY_PARTITION_SIZE bytes"

          if [ "$IMAGE_SIZE" -gt "$RECOVERY_PARTITION_SIZE" ]; then
            echo "::warning::recovery.img exceeds the A35X recovery partition. The artifact will be kept for analysis but MUST NOT be flashed."
            FITS_PARTITION=false
            echo "RECOVERY_FITS_PARTITION=false" >> "$GITHUB_ENV"
          else
            FITS_PARTITION=true
            echo "RECOVERY_FITS_PARTITION=true" >> "$GITHUB_ENV"
          fi

          python3 - "$IMAGE" <<'PY'
          import pathlib, sys
          image = pathlib.Path(sys.argv[1])
          with image.open("rb") as stream:
              magic = stream.read(8)
          if magic != b"ANDROID!":
              raise SystemExit(
                  f"Invalid Android boot-image magic: {magic!r}; expected b'ANDROID!'"
              )
          print(f"Verified Android boot image header: {image}")
          PY

          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp -v "$IMAGE" "$GITHUB_WORKSPACE/dist/recovery.img"
          sha256sum "$GITHUB_WORKSPACE/dist/recovery.img" \
            | tee "$GITHUB_WORKSPACE/dist/SHA256SUMS.txt"

          {
            echo "Build: AERA Recovery 16.0 — Samsung Galaxy A35 5G"
            echo "Codename: a35x"
            echo "Manifest: https://github.com/AERA-Recovery/android_manifest"
            echo "Manifest branch: $MANIFEST_BRANCH"
            echo "Device tree: $DEVICE_TREE"
            echo "Device tree branch: $DEVICE_TREE_BRANCH"
            echo "Device tree commit: $DEVICE_COMMIT"
            echo "Lunch target: twrp_a35x-bp2a-eng"
            echo "Build target: $BUILD_TARGET"
            echo "Recovery partition limit: $RECOVERY_PARTITION_SIZE bytes"
            echo "Image size: $IMAGE_SIZE bytes"
            echo "Fits recovery partition: $FITS_PARTITION"
            echo "Build UTC: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > "$GITHUB_WORKSPACE/dist/BUILD-INFO.txt"

          ls -lh "$GITHUB_WORKSPACE/dist"

      - name: Upload GitHub Actions artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AERA-Recovery-A35x-first-build
          path: dist/
          if-no-files-found: error
          retention-days: 30

      - name: Set build information
        if: success()
        run: |
          echo "BUILD_DATE=$(date -u +%Y%m%d-%H%M)" >> "$GITHUB_ENV"

      - name: Publish test prerelease
        if: success() && inputs.RELEASE == true && env.RECOVERY_FITS_PARTITION == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: AERA-A35x-first-build-${{ github.run_number }}
          name: '[TEST] AERA Recovery A35x — First build #${{ github.run_number }}'
          prerelease: true
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true
          body: |
            # TEST BUILD — AERA Recovery 16.0 / Samsung Galaxy A35 5G

            This is a first-build artifact, not a stable release.
            - Manifest branch: ${{ inputs.MANIFEST_BRANCH }}
            - Device tree: ${{ inputs.DEVICE_TREE }}
            - Device branch: ${{ inputs.DEVICE_TREE_BRANCH }}
            - Device commit: ${{ env.DEVICE_COMMIT }}
            - Lunch target: twrp_a35x-bp2a-eng
            - Build target: ${{ inputs.BUILD_TARGET }}
            - Build date: ${{ env.BUILD_DATE }}

            The build workflow verifies the Android boot-image magic and checks
            that recovery.img does not exceed the configured recovery partition.
            No on-device boot or decryption validation is implied.
